name: Bug report
description: Something does not work the way the docs say it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A sentence or two is fine. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it happen?
      description: Steps, a command, or a small example. Optional, but it helps us fix it faster.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: e.g. v1.2.0 on macOS 15, or the commit you built from
  - type: markdown
    attributes:
      value: |
        Please leave out passwords, tokens, keys and customer data. For a security problem,
        use private vulnerability reporting instead (see the security policy link on the previous page).
